<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Peluquería Capital</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0E0C0A;
            color: #EDE8DF;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #181410;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 600px;
            border: 1px solid #C9A84C;
        }

        h1 {
            color: #C9A84C;
            margin-bottom: 20px;
        }

        p {
            margin: 10px 0;
            font-size: 18px;
        }

        .numero {
            font-size: 24px;
            color: #C9A84C;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            text-decoration: none;
            color: #C9A84C;
            border: 1px solid #C9A84C;
            transition: .3s;
        }

        .btn:hover {
            background: #C9A84C;
            color: #0E0C0A;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>💈 Contacto</h1>

    <p>
        <strong>Peluquería Capital</strong>
    </p>

    <p>
        Bogotá, Colombia
    </p>

    <p class="numero">
        📞 324 608 3901
    </p>

    <p>
        Contáctanos para reservas, consultas y atención personalizada.
    </p>

    <a href="/" class="btn">
        Volver al inicio
    </a>

</div>

</body>
</html>
